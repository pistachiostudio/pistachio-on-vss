<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5W20EVMG6T"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-5W20EVMG6T');
    </script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- TITLE & META DESCRIPTION (下のページ用。title は各 .md の frontmatter から) -->
    <title>{{title}} | {{site_title}}</title>
    <!-- description は各 .md の frontmatter。なければ vss.toml の site_description -->
    <meta name="description" content="{{#description}}{{description}}{{/description}}{{^description}}{{site_description}}{{/description}}" />
    <!-- canonical と og:url は各 .md の frontmatter の post_slug(.html なしのファイル名)から。ないページには出さない -->
    {{#post_slug}}<link rel="canonical" href="{{base_url}}{{post_slug}}" />{{/post_slug}}
    <meta name="theme-color" content="#202020" />
    <!-- SNS LINK PREVIEW METADATA OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{site_title}}" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="{{title}} | {{site_title}}" />
    <meta property="og:description" content="{{#description}}{{description}}{{/description}}{{^description}}{{site_description}}{{/description}}" />
    {{#post_slug}}<meta property="og:url" content="{{base_url}}{{post_slug}}" />{{/post_slug}}
    <meta property="og:image" content="https://pistachiostudio.net/og_image_banana_maru.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@pstchstd" />
    <!-- FAVICON -->
    <link rel="icon" sizes="16x16" href="favicon.ico" />
    <link rel="icon" sizes="32x32" href="favicon.ico" />
    <link rel="icon" sizes="48x48" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- FONT (M PLUS 1 Code, SIL OFL 1.1) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400&display=swap" rel="stylesheet" />
    <!-- CSS (色は style.css の :root だけ。canvas もそこから読む) -->
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- うしろの絵(川べり。下のページに犬はいない)。js/scene.js が描く -->
    <canvas id="dog" role="img" aria-label="夜の川べり"></canvas>

    <main class="site">
        <header>
            <h1><a href="/">Pistachio Studio</a></h1>
            <p class="tag">Neighborhood recording crew from kngw, Japan.</p>
        </header>

        <section class="md">
            <p class="back"><a href="/">&larr; Top</a></p>
            <h2 class="page">{{title}}</h2>
            <!-- @CONTENTS (各 .md) -->
            {{{contents}}}
            <!-- /@CONTENTS -->
        </section>

        <footer class="foot">
            <p>Acknowledgments: <a href="https://github.com/veltiosoft/vss">VSS</a>,
                <a href="https://fonts.google.com/specimen/M+PLUS+1+Code">M PLUS 1 Code</a> (SIL OFL 1.1)</p>
            <p>GitHub repository: <a href="https://github.com/pistachiostudio/pistachio-on-vss">pistachio-on-vss</a></p>
            <p>Hosted by: <a href="https://pages.github.com/">GitHub Pages</a></p>
            <p>&copy; 2005-<span id="copyright-year">2026</span> Pistachio Studio</p>
        </footer>
    </main>

    <script>
        document.getElementById("copyright-year").textContent = new Date().getFullYear();
        // 外へのリンクは新しいタブで開く
        document.querySelectorAll('.site a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
    </script>
    <!-- data-copy のボタン(contact.md のメールアドレスのコピー) -->
    <script src="js/copy.js"></script>
    <!-- 絵を描くスクリプト(犬のデータ dogs.js は読まないので、景色だけになる) -->
    <script src="js/scene.js"></script>
</body>

</html>
